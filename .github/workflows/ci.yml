name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Unit tests (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 ./...

      - name: Race detector tests
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...
